<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POV Sync — UI/UX Review Checklist</title>
  <style>
    :root {
      --bg: #0e0b14;
      --surface: #1a1525;
      --surface-hover: #241e32;
      --border: #2e2640;
      --text: #e8e4ef;
      --text-muted: #9b93ab;
      --accent: #a78bfa;
      --accent-dim: rgba(167, 139, 250, 0.15);
      --red: #f87171;
      --red-bg: rgba(248, 113, 113, 0.1);
      --red-border: rgba(248, 113, 113, 0.25);
      --orange: #fb923c;
      --orange-bg: rgba(251, 146, 60, 0.1);
      --orange-border: rgba(251, 146, 60, 0.25);
      --yellow: #facc15;
      --yellow-bg: rgba(250, 204, 21, 0.1);
      --yellow-border: rgba(250, 204, 21, 0.25);
      --green: #4ade80;
      --green-bg: rgba(74, 222, 128, 0.1);
      --green-border: rgba(74, 222, 128, 0.25);
      --blue: #60a5fa;
      --blue-bg: rgba(96, 165, 250, 0.1);
      --blue-border: rgba(96, 165, 250, 0.25);
      --cyan: #22d3ee;
      --cyan-bg: rgba(34, 211, 238, 0.1);
      --cyan-border: rgba(34, 211, 238, 0.25);
      --done-bg: rgba(74, 222, 128, 0.06);
      --done-border: rgba(74, 222, 128, 0.2);
      --wip-bg: rgba(34, 211, 238, 0.06);
      --wip-border: rgba(34, 211, 238, 0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--accent), #c4b5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Progress bar */
    .progress-bar-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .progress-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .progress-stats .count { color: var(--accent); font-weight: 600; }
    .progress-stats .wip-count { color: var(--cyan); font-weight: 600; font-size: 0.8rem; }
    .progress-stats .percentage { color: var(--text-muted); }

    .progress-track {
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
    }

    .progress-fill-done {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #c4b5fd);
      transition: width 0.4s ease;
      width: 0%;
    }

    .progress-fill-wip {
      height: 100%;
      background: linear-gradient(90deg, var(--cyan-border), var(--cyan));
      transition: width 0.4s ease;
      width: 0%;
      opacity: 0.6;
    }

    .filter-row {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      font-size: 0.78rem;
      padding: 0.3rem 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover { background: var(--surface-hover); color: var(--text); }
    .filter-btn.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }

    .filter-divider {
      width: 1px;
      background: var(--border);
      align-self: stretch;
      margin: 0 0.15rem;
    }

    /* Sections */
    .section { margin-bottom: 2rem; }

    .section-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      cursor: pointer;
      user-select: none;
    }

    .section-header:hover .section-title { color: var(--accent); }

    .section-chevron {
      font-size: 0.75rem;
      color: var(--text-muted);
      transition: transform 0.2s;
      width: 1rem;
      text-align: center;
    }

    .section-header.collapsed .section-chevron { transform: rotate(-90deg); }

    .section-title { font-size: 1.15rem; font-weight: 600; transition: color 0.2s; }
    .section-count { font-size: 0.75rem; color: var(--text-muted); margin-left: auto; }

    .section-body { display: flex; flex-direction: column; gap: 0.5rem; }
    .section-body.hidden { display: none; }

    /* Items */
    .item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      transition: all 0.2s;
    }

    .item:hover { border-color: #3d3555; }

    .item.status-done {
      background: var(--done-bg);
      border-color: var(--done-border);
    }
    .item.status-done .item-title { text-decoration: line-through; color: var(--text-muted); }
    .item.status-done .severity-badge { opacity: 0.4; }

    .item.status-wip {
      background: var(--wip-bg);
      border-color: var(--wip-border);
    }

    .item-header {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 1rem 1.25rem;
      cursor: pointer;
      user-select: none;
    }

    /* 3-state status button */
    .status-btn {
      width: 22px;
      height: 22px;
      min-width: 22px;
      border: 2px solid var(--border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 1px;
      font-size: 0.65rem;
      font-weight: 700;
      background: transparent;
      color: transparent;
      position: relative;
    }

    .status-btn:hover { border-color: var(--accent); transform: scale(1.1); }

    .status-btn.s-wip {
      border-color: var(--cyan);
      background: var(--cyan-bg);
      color: var(--cyan);
      animation: pulse-wip 2s ease-in-out infinite;
    }

    .status-btn.s-done {
      border-color: var(--green);
      background: var(--green);
      color: var(--bg);
    }

    @keyframes pulse-wip {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.3); }
      50% { box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.08); }
    }

    .item-title-row {
      flex: 1;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .item-title {
      font-size: 0.92rem;
      font-weight: 500;
      flex: 1;
      min-width: 200px;
    }

    .severity-badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.15rem 0.55rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .severity-critical { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
    .severity-significant { background: var(--orange-bg); color: var(--orange); border: 1px solid var(--orange-border); }
    .severity-moderate { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
    .severity-minor { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }

    .tag {
      font-size: 0.68rem;
      padding: 0.12rem 0.5rem;
      border-radius: 4px;
      background: var(--accent-dim);
      color: var(--accent);
      white-space: nowrap;
    }

    .wip-badge {
      font-size: 0.68rem;
      padding: 0.12rem 0.5rem;
      border-radius: 4px;
      background: var(--cyan-bg);
      color: var(--cyan);
      border: 1px solid var(--cyan-border);
      white-space: nowrap;
      font-weight: 600;
      animation: pulse-wip 2s ease-in-out infinite;
    }

    .item-expand-icon {
      font-size: 0.7rem;
      color: var(--text-muted);
      transition: transform 0.2s;
      margin-top: 4px;
    }

    .item.expanded .item-expand-icon { transform: rotate(90deg); }

    .item-details {
      display: none;
      padding: 0 1.25rem 1.25rem 3.25rem;
      font-size: 0.87rem;
      color: var(--text-muted);
      line-height: 1.7;
    }

    .item.expanded .item-details { display: block; }
    .item-details strong { color: var(--text); font-weight: 600; }

    .detail-section { margin-bottom: 0.75rem; }
    .detail-section:last-child { margin-bottom: 0; }

    .detail-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .files-list { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.25rem; }

    .file-tag {
      font-size: 0.72rem;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      padding: 0.15rem 0.5rem;
      background: var(--blue-bg);
      color: var(--blue);
      border-radius: 4px;
      border: 1px solid var(--blue-border);
    }

    /* Status legend */
    .status-legend {
      display: flex;
      gap: 1.25rem;
      margin-top: 0.75rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }
    .status-legend span {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .legend-dot {
      width: 10px; height: 10px; border-radius: 3px; display: inline-block;
    }
    .legend-dot.todo { border: 2px solid var(--border); }
    .legend-dot.wip { background: var(--cyan); }
    .legend-dot.done { background: var(--green); }

    /* Responsive */
    @media (max-width: 640px) {
      .container { padding: 1rem; }
      header h1 { font-size: 1.35rem; }
      .item-header { padding: 0.85rem 1rem; }
      .item-details { padding: 0 1rem 1rem 2.75rem; }
      .filter-row { gap: 0.35rem; }
      .filter-btn { font-size: 0.72rem; padding: 0.25rem 0.6rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>POV Sync — UI/UX Review Checklist</h1>
      <p>Merged feedback from Sonnet, GPT &amp; Flow reviews &bull; <span id="totalCount">0</span> items</p>
    </header>

    <div class="progress-bar-container">
      <div class="progress-stats">
        <span class="count"><span id="doneCount">0</span> / <span id="totalCountBar">0</span> completed</span>
        <span class="wip-count"><span id="wipCount">0</span> in progress</span>
        <span class="percentage" id="percentText">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill-done" id="progressFillDone"></div>
        <div class="progress-fill-wip" id="progressFillWip"></div>
      </div>
      <div class="filter-row">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="todo">To Do</button>
        <button class="filter-btn" data-filter="wip" style="color:var(--cyan)">In Progress</button>
        <button class="filter-btn" data-filter="done">Done</button>
        <span class="filter-divider"></span>
        <button class="filter-btn" data-filter="critical" style="color:var(--red)">Critical</button>
        <button class="filter-btn" data-filter="significant" style="color:var(--orange)">Significant</button>
        <button class="filter-btn" data-filter="moderate" style="color:var(--yellow)">Moderate</button>
        <button class="filter-btn" data-filter="minor" style="color:var(--green)">Minor</button>
      </div>
      <div class="status-legend">
        <span><span class="legend-dot todo"></span> Click → In Progress</span>
        <span><span class="legend-dot wip"></span> Click → Done</span>
        <span><span class="legend-dot done"></span> Click → Reset</span>
      </div>
    </div>

    <div id="sections"></div>
  </div>

  <script>
    // ───── DATA ─────
    const DATA = [
      {
        section: "Architecture & Code Organization",
        items: [
          {
            id: "arch-1",
            severity: "critical",
            title: "Break up Viewer.jsx (~2,800 lines) into composable sub-components",
            tags: ["Architecture", "Viewer"],
            files: ["client/src/pages/Viewer.jsx"],
            details: `<div class="detail-section"><div class="detail-label">Problem</div>Viewer.jsx is a monolithic ~2,800-line file with 60+ state variables. Sub-components like <strong>SyncStatusPanel</strong>, <strong>OffsetControls</strong>, <strong>AddPovModal</strong>, and <strong>ParticipantBar</strong> are all defined inline. This causes real UX issues: complex conditional render chains make it hard to guarantee consistent visual states. The VOD notice, anchor-dead banner, and master controls can all appear simultaneously with no visual hierarchy separating them.</div><div class="detail-section"><div class="detail-label">Action</div>Extract each logical section into its own file under <code>client/src/components/</code>. Lift shared state into a context or a custom hook (<code>useSessionSync</code>, <code>useViewerState</code>). Each extracted component should own its own conditional rendering rather than relying on a long chain of ternaries in a parent.</div>`
          },
          {
            id: "arch-2",
            severity: "moderate",
            title: "Deduplicate Viewer.jsx and Spectator.jsx shared layouts",
            tags: ["Architecture", "DRY"],
            files: ["client/src/pages/Viewer.jsx", "client/src/pages/Spectator.jsx"],
            details: `<div class="detail-section"><div class="detail-label">Problem</div>The room header, filmstrip, stage/wall/cycle views, and playback controls are duplicated across two ~1,000–2,800-line files. Any UI change (e.g., changing view-mode button icons) needs to be made in two places. This directly causes visual divergence over time.</div><div class="detail-section"><div class="detail-label">Action</div>Create shared layout components: <code>SessionRoomLayout</code>, <code>ViewModeSelector</code>, <code>Filmstrip</code>. Pass role-specific props (<code>isHost</code>, <code>canControl</code>) to toggle host-only controls, rather than duplicating the entire tree.</div>`
          },
          {
            id: "arch-3",
            severity: "minor",
            title: "Extract reusable copy-to-clipboard hook",
            tags: ["DX", "Hooks"],
            files: ["client/src/components/InfoPill.jsx", "client/src/pages/Viewer.jsx"],
            details: `<div class="detail-section"><div class="detail-label">Problem</div>Copy feedback ("\u2713" for 2 seconds) is managed with <code>setTimeout</code> scattered across multiple components (InfoPill, ShareLinks panel, etc.) without a reusable hook. This is a DX issue that can cause stale-closure bugs if a user rapidly copies.</div><div class="detail-section"><div class="detail-label">Action</div>Create a <code>useCopyToClipboard()</code> hook that returns <code>{ copied, copy }</code> and handles the timeout + cleanup internally. Use it everywhere copy logic appears.</div>`
          },
          {
            id: "arch-4",
            severity: "moderate",
            title: "Simplify JoinSession.jsx conditional render chain",
            tags: ["Architecture", "UX"],
            files: ["client/src/pages/JoinSession.jsx"],
            details: `<div class="detail-section"><div class="detail-label">Problem</div>JoinSession.jsx has 7 different conditional render states in sequence: Loading \u2192 No code \u2192 Error \u2192 Session ended \u2192 Session full \u2192 Not logged in \u2192 Join form. These are all conditionally rendered with no animated transitions between them. If a user\u2019s state changes mid-flow (e.g., session fills up while they\u2019re typing), the UI snaps abruptly.</div><div class="detail-section"><div class="detail-label">Action</div>Consolidate states into a state machine or a single <code>status</code> variable. Add a fade/slide transition between states using <code>framer-motion</code> or CSS <code>@starting-style</code> transitions.</div>`
          }
        ]
      },
      {
        section: "Loading, Transitions & Empty States",
        items: [
          {
            id: "load-1",
            severity: "critical",
            title: "Add loading skeleton / transition for session room entry",
            tags: ["UX", "Performance"],
            files: ["client/src/pages/Viewer.jsx", "client/src/pages/Spectator.jsx"],
            details: `<div class="detail-section"><div class="detail-label">Problem</div>When navigating to <code>/session/:id</code>, there\u2019s no skeleton UI or placeholder. Users see either a blank state or a sudden full render. For a real-time sync app, this perceived latency is especially damaging to trust.</div><div class="detail-section"><div class="detail-label">Action</div>Create a <code>SessionSkeleton</code> component showing placeholder shapes for the room header, filmstrip, and stage area. Render it during the initial data fetch. Use a fade-in transition when real content arrives.</div>`
          },
          {
            id: "load-2",
            severity: "critical",
            title: "Replace inline 404 div with a proper 404 page",
            tags: ["UX", "Navigation"],
            files: ["client/src/App.jsx"],
            details: `<div class="detail-section"><div class="detail-label">Problem</div>The 404 fallback in App.jsx is a bare centered <code>&lt;div&gt;</code>. It has no navigation link back to home, no branding, and no visual consistency with the rest of the app.</div><div class="detail-section"><div class="detail-label">Action</div>Create a <code>NotFound.jsx</code> page component with the app\u2019s visual language, a clear \u201cPage not found\u201d message, and a prominent \u201cBack to Home\u201d button. Match the glassmorphism style of the rest of the app.</div>`
          },
          {
            id: "load-3",
            severity: "moderate",
            title: "Improve error and empty states with actionable guidance",
            tags: ["UX", "Polish"],
            files: ["client/src/components/ErrorState.jsx"],
            details: `<div class="detail-section"><div class="detail-label">Problem</div>Error and empty states are functional but generic. They do the job but don\u2019t guide users with specific next steps or strong visual framing. They feel stylistically flat compared to the rest of the app.</div><div class="detail-section"><div class="detail-label">Action</div>Add contextual messaging per error type (network, not found, permission). Include specific recovery CTAs (\u201cTry again\u201d, \u201cGo home\u201d, \u201cCheck your connection\u201d). Upgrade the visual treatment to match the app\u2019s glassmorphism style with appropriate severity coloring.</div>`
          },
          {
            id: "load-4",
            severity: "moderate",
            title: "Add animated transitions between JoinSession states",
            tags: ["UX", "Polish"],
            files: ["client/src/pages/JoinSession.jsx"],
            details: `<div class="detail-section"><div class="detail-label">Problem</div>JoinSession snaps abruptly between its 7 conditional states with no animation. State changes mid-flow (session fills up while typing) feel jarring.</div><div class="detail-section"><div class="detail-label">Action</div>Wrap each state in an <code>AnimatePresence</code> / <code>motion.div</code> block (or CSS transitions) so states cross-fade smoothly. Consider a brief exit animation before the entrance of a new state.</div>`
          }
        ]
      },
      {
        section: "Navigation & Information Architecture",
        items: [
          {
            id: "nav-1",
            severity: "significant",
            title: "Fix mobile navbar: replace \u2715 sign-out icon with explicit action",
            tags: ["Mobile", "UX"],
            files: ["client/src/components/Navbar.jsx"],
            details: `<div class="detail-section"><div class="detail-label">Problem</div>On mobile, \u201cSign out\u201d becomes a \u2715 icon. The \u2715 is conventionally a \u201cclose\u201d action, not a destructive account action. A user unfamiliar with the app could be confused or accidentally sign out thinking they\u2019re closing something. The Setup Guide link and display name are also hidden on mobile.</div><div class="detail-section"><div class="detail-label">Action</div>Replace \u2715 with an explicit \u201cSign out\u201d label or a recognizable logout icon (e.g., Lucide <code>LogOut</code>). Consider a mobile hamburger/drawer that preserves all nav items. Add the display name back in a condensed form.</div>`
          },
          {
            id: "nav-2",
            severity: "significant",
            title: "Add a footer with legal / informational links",
            tags: ["UX", "Legal"],
            files: ["client/src/components/Footer.jsx (new)", "client/src/App.jsx"],
            details: `<div class="detail-section"><div class="detail-label">Problem</div>The app has no footer \u2014 no links to terms of service, privacy policy, contact, or even a \u201cback to top.\u201d For a service with user accounts and potentially shared public sessions, the absence of any legal/informational links is notable.</div><div class="detail-section"><div class="detail-label">Action</div>Create a minimal <code>Footer</code> component with links for Terms, Privacy, Contact/Support, and a \u00a9 line. Include it on all non-session pages. On session pages, optionally hide it to preserve immersion.</div>`
          },
          {
            id: "nav-3",
            severity: "significant",
            title: "Handle /create URL \u2014 redirect silently loses bookmarkability",
            tags: ["UX", "Routing"],
            files: ["client/src/pages/CreateSession.jsx", "client/src/App.jsx"],
            details: `<div class="detail-section"><div class="detail-label">Problem</div>CreateSession.jsx is literally <code>&lt;Navigate to="/" replace /&gt;</code>. If a user bookmarks <code>/create</code> or shares it, they silently land on the homepage with no explanation. The inline form expansion on Home is clever, but loses direct-link discoverability.</div><div class="detail-section"><div class="detail-label">Action</div>Either (a) make <code>/create</code> a real standalone page with the session creation form, or (b) redirect to <code>/?action=create</code> and auto-expand the create form on arrival with a brief toast explaining the redirect.</div>`
          },
          {
            id: "nav-4",
            severity: "moderate",
            title: "Strengthen navbar active-state system and section separation",
            tags: ["UX", "Navigation"],
            files: ["client/src/components/Navbar.jsx"],
            details: `<div class="detail-section"><div class="detail-label">Problem</div>The live-session return pill is excellent, but the rest of the nav is visually minimal compared to the complexity it supports. Users may not notice the theme toggle, setup guide, or profile entry points as clearly as the session-return action. There\u2019s no clear separation between utility actions and account/session actions.</div><div class="detail-section"><div class="detail-label">Action</div>Add a stronger active/current-page indicator. Visually group utility actions (theme, setup) separately from identity actions (profile, sign out). Consider subtle dividers or grouped backgrounds.</div>`
          },
          {
            id: "nav-5",
            severity: "moderate",
            title: "Surface Ctrl+K shortcut and make it global",
            tags: ["UX", "Discoverability"],
            files: ["client/src/pages/Home.jsx"],
            details: `<div class="detail-section"><div class="detail-label">Problem</div>The Ctrl+K shortcut to toggle the Join panel is implemented locally in Home.jsx. It\u2019s not surfaced to the user anywhere (no tooltip, no keyboard shortcuts overlay on the home page), making it effectively invisible. It only works on one page.</div><div class="detail-section"><div class="detail-label">Action</div>Move the Ctrl+K handler to a global level (App or a global shortcuts hook). Add a subtle \u201c\u2318K\u201d / \u201cCtrl+K\u201d hint next to the Join button. Consider adding it to the keyboard shortcuts overlay (?) if one exists globally.</div>`
          },
          {
            id: "nav-6",
            severity: "significant",
            title: "Add active page indicator to navbar",
            tags: ["UX", "Navigation"],
            files: ["client/src/components/Navbar.jsx"],

            details: `<div class="detail-section"><div class="detail-label">Problem</div>\ud83d\udfe3, \ud83d\udfe2, \u2693, \ud83d\udcfc, \ud83d\udecb\ufe0f, \ud83d\udca1, \u26a0\ufe0f, \ud83d\udc8e are used as UI icons extensively. Emoji rendering is inconsistent across OSes, and screen readers announce them literally.</div><div class="detail-section"><div class="detail-label">Action</div>Replace all functional emoji with SVG icons from a library (Lucide, Heroicons, Phosphor). Use <code>aria-hidden="true"</code> on decorative icons and <code>aria-label</code> on semantic ones.</div>`

            details: `<div class="detail-section"><div class="detail-label">Problem</div>In both Viewer and Spectator, the session title is the only <code>&lt;h1&gt;</code>. Sub-panels have no headings at all \u2014 just bold text. This makes the page structure flat for screen readers.</div><div class="detail-section"><div class="detail-label">Action</div>Add <code>&lt;h2&gt;</code> headings to major panel sections (Sync Status, Playback Controls, Participants). Use <code>&lt;h3&gt;</code> for sub-sections. Visually style them to match the current bold text while being semantically correct.</div>`

    // ───── STATE ─────
    const STORAGE_KEY = "pov-sync-review-checklist-v2";
    let itemStatuses = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

    // Migrate from v1 if needed
    const V1_KEY = "pov-sync-review-checklist";
    const v1Data = JSON.parse(localStorage.getItem(V1_KEY) || "{}");
    if (Object.keys(v1Data).length && !Object.keys(itemStatuses).length) {
      for (const [id, val] of Object.entries(v1Data)) {
        if (val) itemStatuses[id] = "done";
      }
      save();
      localStorage.removeItem(V1_KEY);
    }

    let currentFilter = "all";
    let collapsedSections = {};

    function getStatus(id) { return itemStatuses[id] || "todo"; }

    function cycleStatus(id) {
      const cur = getStatus(id);
      if (cur === "todo") itemStatuses[id] = "wip";
      else if (cur === "wip") itemStatuses[id] = "done";
      else delete itemStatuses[id];
      save();
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(itemStatuses));
    }

    // ───── RENDER ─────
    const sectionsEl = document.getElementById("sections");

    function getAllItems() { return DATA.flatMap(s => s.items); }

    function shouldShowItem(item) {
      const s = getStatus(item.id);
      if (currentFilter === "todo") return s === "todo";
      if (currentFilter === "wip") return s === "wip";
      if (currentFilter === "done") return s === "done";
      if (["critical","significant","moderate","minor"].includes(currentFilter)) return item.severity === currentFilter;
      return true;
    }

    function render() {
      const allItems = getAllItems();
      const total = allItems.length;
      const doneCount = allItems.filter(i => getStatus(i.id) === "done").length;
      const wipCount = allItems.filter(i => getStatus(i.id) === "wip").length;

      document.getElementById("totalCount").textContent = total;
      document.getElementById("totalCountBar").textContent = total;
      document.getElementById("doneCount").textContent = doneCount;
      document.getElementById("wipCount").textContent = wipCount;
      document.getElementById("percentText").textContent = Math.round((doneCount / total) * 100) + "%";
      document.getElementById("progressFillDone").style.width = ((doneCount / total) * 100) + "%";
      document.getElementById("progressFillWip").style.width = ((wipCount / total) * 100) + "%";

      sectionsEl.innerHTML = "";

      DATA.forEach((section, si) => {
        const visibleItems = section.items.filter(shouldShowItem);
        if (visibleItems.length === 0) return;

        const sectionDone = section.items.filter(i => getStatus(i.id) === "done").length;
        const sectionWip = section.items.filter(i => getStatus(i.id) === "wip").length;
        const isCollapsed = collapsedSections[si];

        const sectionEl = document.createElement("div");
        sectionEl.className = "section";

        const headerEl = document.createElement("div");
        headerEl.className = "section-header" + (isCollapsed ? " collapsed" : "");

        let countLabel = `${sectionDone}/${section.items.length}`;
        if (sectionWip > 0) countLabel += ` \u00b7 ${sectionWip} wip`;

        headerEl.innerHTML = `
          <span class="section-chevron">\u25bc</span>
          <span class="section-title">${section.section}</span>
          <span class="section-count">${countLabel}</span>
        `;
        headerEl.onclick = () => { collapsedSections[si] = !collapsedSections[si]; render(); };
        sectionEl.appendChild(headerEl);

        const bodyEl = document.createElement("div");
        bodyEl.className = "section-body" + (isCollapsed ? " hidden" : "");

        visibleItems.forEach(item => {
          const status = getStatus(item.id);
          const itemEl = document.createElement("div");
          itemEl.className = "item" + (status === "done" ? " status-done" : status === "wip" ? " status-wip" : "");
          itemEl.dataset.id = item.id;

          const btnClass = status === "done" ? "s-done" : status === "wip" ? "s-wip" : "";
          const btnContent = status === "done" ? "\u2713" : status === "wip" ? "\u25c9" : "";
          const wipBadge = status === "wip" ? '<span class="wip-badge">IN PROGRESS</span>' : '';

          itemEl.innerHTML = `
            <div class="item-header">
              <div class="status-btn ${btnClass}" data-status="${item.id}" title="Click to cycle: To Do \u2192 In Progress \u2192 Done">${btnContent}</div>
              <div class="item-title-row">
                <span class="item-title">${item.title}</span>
                ${wipBadge}
                <span class="severity-badge severity-${item.severity}">${item.severity}</span>
                ${item.tags.map(t => `<span class="tag">${t}</span>`).join("")}
              </div>
              <span class="item-expand-icon">\u25b6</span>
            </div>
            <div class="item-details">
              ${item.details}
              <div class="detail-section">
                <div class="detail-label">Files</div>
                <div class="files-list">
                  ${item.files.map(f => `<span class="file-tag">${f}</span>`).join("")}
                </div>
              </div>
            </div>
          `;

          itemEl.querySelector(".status-btn").addEventListener("click", (e) => {
            e.stopPropagation();
            cycleStatus(item.id);
            render();
          });

          itemEl.querySelector(".item-header").addEventListener("click", (e) => {
            if (e.target.closest(".status-btn")) return;
            itemEl.classList.toggle("expanded");
          });

          bodyEl.appendChild(itemEl);
        });

        sectionEl.appendChild(bodyEl);
        sectionsEl.appendChild(sectionEl);
      });
    }

    // ───── FILTERS ─────
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    // ───── INIT ─────
    render();
  </script>
