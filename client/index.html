<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16141e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- SEO & description -->
    <meta name="description" content="POV Sync lets you watch multiple live streams or VODs in perfect sync. Create a room, add YouTube or Twitch POVs, and switch angles with frame-accurate timing." />
    <meta name="keywords" content="multi-POV, stream sync, multi-stream, YouTube sync, Twitch sync, watch party, VOD sync" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="POV Sync" />
    <meta property="og:title" content="POV Sync — Watch every angle in perfect sync" />
    <meta property="og:description" content="Create a room, add YouTube or Twitch POVs, and switch between synced streams with frame-accurate timing." />
    <meta property="og:image" content="https://pov-sync.onrender.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="POV Sync — multi-stream synchronization" />
    <meta property="og:url" content="https://pov-sync.onrender.com" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="POV Sync — Watch every angle in perfect sync" />
    <meta name="twitter:description" content="Create a room, add YouTube or Twitch POVs, and switch between synced streams with frame-accurate timing." />
    <meta name="twitter:image" content="https://pov-sync.onrender.com/og-image.png" />
    <meta name="twitter:image:alt" content="POV Sync — multi-stream synchronization" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <title>POV Sync — Multi-Stream Synchronization</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Restore saved theme or default to dark
      const t = localStorage.getItem('pov-theme') || 'dark';
      document.documentElement.classList.remove('dark', 'light');
      document.documentElement.classList.add(t);
    </script>
  </head>
  <body class="bg-pov-bg text-pov-text min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
